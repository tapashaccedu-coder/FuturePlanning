<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  
  <!-- Shield -->
  <path d="M256 80 L400 144 L400 272 Q400 384 256 448 Q112 384 112 272 L112 144 Z"
        fill="#e8a800" fill-opacity="0.15" stroke="#e8a800" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Checkmark -->
  <polyline points="168,256 224,320 344,192"
            fill="none" stroke="#e8a800" stroke-width="36"
            stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Small dollar sign below check -->
  <text x="256" y="410" font-family="Georgia,serif" font-size="72" font-weight="bold"
        fill="#e8a800" fill-opacity="0.7" text-anchor="middle">$</text>
</svg>
